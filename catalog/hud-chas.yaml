id: hud-chas
type: dataset
title: HUD Comprehensive Housing Affordability Strategy (CHAS) Data
description: |
  Custom tabulations of American Community Survey data that HUD receives from the Census Bureau each year, showing housing problems, cost burden and housing needs by household income, especially for low-income households. Local governments use them to plan how to spend HUD funds in their Consolidated Plans.
publisher: U.S. Department of Housing and Urban Development (HUD), Office of Policy Development and Research
jurisdiction:
  scope: national
  country: US
topics:
- affordability
- cost-burden
- housing-needs
- low-income-households
- united-states
source:
  canonical_url: https://www.huduser.gov/portal/datasets/cp.html
access:
  method:
  - web
  - bulk
  - api
  auth_required: false
  auth_note: The query tool and bulk downloads need no account; the CHAS API needs a free HUD User account and access token.
  rate_limit: null
