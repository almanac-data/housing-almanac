notes: |
  Human-verified 2026-10-31: HTTP 200. The CFPB page "Home Mortgage Disclosure Act (HMDA) Data" says "Each year, millions of people apply for mortgages. Using HMDA data, we can learn what happened to the vast majority of those applications". It was last modified Oct. 16, 2026, and links the news item "2025 HMDA Data on Mortgage Lending Now Available" (Mar 31, 2026). The data-publication site https://ffiec.cfpb.gov/data-publication/ (HTTP 200, redirects to /data-publication/2025) calls HMDA "the most comprehensive source of publicly available information on the U.S. mortgage market". It offers a weekly-updated "Dynamic National Loan-Level Dataset" and a snapshot dataset ("Data Freeze Date: June 2, 2026"), and says pre-2017 data are at ffiec.gov. The CFPB landing page is cataloged because the data-publication URL redirects to a different year each release.
  Licence checked 2026-10-31: https://www.consumerfinance.gov/privacy/website-privacy-policy/ states "Information created by the CFPB is in the public domain and you may reproduce, publish, or otherwise use it without the Bureau's permission. Please consider appropriate citation to the Bureau as the source." The released files are compiled from filings by lenders and modified by the CFPB for privacy. The Data Browser API and file formats weren't checked.
