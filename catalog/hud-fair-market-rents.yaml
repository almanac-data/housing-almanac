id: hud-fair-market-rents
type: dataset
title: HUD Fair Market Rents
description: |
  HUD's annual Fair Market Rents — estimates of 40th-percentile gross rents for standard-quality units by bedroom count for every metropolitan area and non-metropolitan county, plus Small Area FMRs by ZIP code — used to set Housing Choice Voucher payment standards and other program rents.
publisher: U.S. Department of Housing and Urban Development, Office of Policy Development and Research
