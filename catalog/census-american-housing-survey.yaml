notes: |
  Human-verified 2026-11-01: HTTP 200 (plain curl and headless Chromium). The page says: "The AHS is sponsored by the Department of Housing and Urban Development (HUD) and conducted by the U.S. Census Bureau. The survey is the most comprehensive national housing survey in the United States." It features the AHS Table Creator and a PUF codebook "1973 and Beyond". The About page says the AHS is "a longitudinal housing unit survey conducted biennially in odd-numbered years, with samples redrawn in 1985, 2015, and 2025. Starting with this new sample, the AHS is shifting to a continuous data collection model", so cadence is set to irregular for now. The Data page (revised May 20, 2026) lists 2023 as the latest year: the "AHS 2023 Public Use File (PUF)", "downloaded in SAS and ASCII formats", and 2023 Summary Tables in Table Creator; "For 1997-2009, Summary Tables are in PDF and/or Excel." HUD USER also has an AHS page (https://www.huduser.gov/portal/datasets/ahs.html), which I did not read. I did not open any files.
  Licence checked 2026-11-01: I found no explicit licence statement on census.gov. The citation guidance (https://www.census.gov/about/policies/citation.html) says data users "should cite the Census Bureau as the source of the original data". public-domain is asserted from the Census Bureau's status as a federal agency (17 U.S.C. 105), not from a Census statement.
