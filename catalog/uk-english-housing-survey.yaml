notes: |
  Human-verified 2026-10-31: HTTP 200. The collection page says "The English Housing Survey is a continuous national survey commissioned by the Ministry of Housing, Communities and Local Government (MHCLG). It collects information about people's housing circumstances and the condition and energy efficiency of housing in England". It was last updated 9 July 2026, with sections for each survey year from 2008 to 2009 through 2024 to 2025 and a set of live tables. The latest items seen include "English Housing Survey 2024 to 2025: private rented sector - pre-Renters' Rights Act overview" (30 September 2026). Microdata are distributed separately through the UK Data Service, which wasn't checked.
  Licence checked 2026-10-31: the GOV.UK footer states "All content is available under the Open Government Licence v3.0, except where otherwise stated". That is a site-footer licence, not a data-specific statement, and the individual live-table files weren't opened to check for a different notice. The formats are assumed and weren't checked.
