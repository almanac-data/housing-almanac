notes: |
  Human-verified 2026-10-31: HTTP 200. The page "Housing statistics" offers "Dwelling characteristics, Housing costs and affordability, Housing price indexes, Housing and living arrangements, Residential construction and investment, Vacancy rates". Its key indicators showed "Homeownership rate - Canada (2021) 66.5%" and "Shelter - Canada (September 2026) 1.8% (12-month change)". It describes the Canadian Housing Statistics Program as providing "comprehensive information on residential properties and their owners". The CHSP survey page on www150.statcan.gc.ca (surveys/5257) and the www150 data tables could not be reached this session (connection reset / 502 through the proxy), so this entry uses the subject hub on www.statcan.gc.ca.
  Licence checked 2026-10-31: https://www.statcan.gc.ca/en/terms-conditions/open-licence grants "a worldwide, royalty-free, non-exclusive licence to: use, reproduce, publish, freely distribute, or sell the Information", with the acknowledgment "Source: Statistics Canada, name of product, reference date. Reproduced and distributed on an "as is" basis with the permission of Statistics Canada." It is a custom open licence, not CC. Formats and the Web Data Service API are assumed from StatCan's usual table delivery and weren't checked. CMHC data were deliberately not folded in; CMHC is a separate Crown corporation with its own terms.
