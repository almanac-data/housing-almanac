notes: |
  Human-verified 2026-10-31 in headless Chromium: HTTP 200, page title "Vivienda". A plain curl with a browser user agent was redirected to a Radware bot-validation page (validate.perfdrive.com), so this host needs a browser. The page reads "Información sobre el volumen de las viviendas del país, sus características de construcción, así como el número de sus ocupantes". It showed "Viviendas particulares habitadas 39,699,242" for 2025, with a chart back to 1990, and noted that the Encuesta Intercensal 2025 "no considera a las viviendas colectivas ... y a la población sin vivienda".
  Licence checked 2026-10-31: https://www.inegi.org.mx/inegi/terminos.html returned 403 to headless Chromium this session but was read via WebFetch. Under "Del libre uso de la información del INEGI" it allows users to copy, distribute, adapt and "explotar comercialmente la información", and requires "Debe otorgar los créditos correspondientes al INEGI como autor", citing as "Fuente: INEGI, nombre del producto de donde se extrae la información". The formats and INEGI's indicator API weren't checked. Rents, prices and housing finance (e.g. SHF or CONAVI) are not covered by this entry.
